name: CI


on:
  push:
  pull_request:


jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app_super_demo_test
          MYSQL_USER: app_user
          MYSQL_PASSWORD: helloworld
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: mysql://app_user:helloworld@127.0.0.1:3306/app_super_demo?serverVersion=8.0.33
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer analyse
